name: Trading Bot

on:
  schedule:
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotheken installieren
        run: pip install -r requirements.txt

      - name: Bot ausführen
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
        run: python main.py


      - name: Ergebnisse speichern
        run: |
          git config --global user.name "Trading Bot"
          git config --global user.email "bot@bot.com"
          git add docs/data.json
          git commit -m "Update data" || echo "Keine Änderungen"
          git push
