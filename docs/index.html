    <title>Trading Bot Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            padding: 16px;
            max-width: 960px;
            margin: 0 auto;
        }
        h1 { color: #58a6ff; font-size: 22px; margin-bottom: 4px; }
        .zeit { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
        h2 { font-size: 12px; color: #8b949e; text-transform: uppercase;
             letter-spacing: 1px; margin: 24px 0 10px; }
        .karten {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 8px;
        }
        .karte {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px;
        }

        .karte p { font-size: 20px; font-weight: bold; }
        .gruen { color: #3fb950; }
        .rot { color: #f85149; }
        .gelb { color: #d29922; }
        .grau { color: #8b949e; }
        .box { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
        .signal-item { background: #0d1117; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
        .news-item { background: #0d1117; border-radius: 8px; padding: 12px; margin-bottom: 8px; }

        .news-symbol { font-weight: bold; font-size: 14px; }
        .news-headline { font-size: 12px; color: #8b949e; padding: 3px 0; border-bottom: 1px solid #21262d; }
        .news-headline:last-child { border-bottom: none; }
        .regime-item { display: inline-block; background: #21262d; border-radius: 6px; padding: 4px 10px; margin: 3px; font-size: 13px; }
        .warnung-item { background: #3a1a1a; border-left: 3px solid #f85149; border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }
        .empfehlung-item { padding: 5px 0; font-size: 13px; border-bottom: 1px solid #21262d; }
        .empfehlung-item:last-child { border-bottom: none; }
        .leer { color: #8b949e; font-style: italic; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { color: #8b949e; text-align: left; padding: 6px 8px; border-bottom: 1px solid #30363d; font-weight: normal; font-size: 11px; text-transform: uppercase; }
        td { padding: 9px 8px; border-bottom: 1px solid #21262d; }
        tr:last-child td { border-bottom: none; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-gruen { background: #1a4a2e; color: #3fb950; }
        .badge-rot { background: #4a1a1a; color: #f85149; }
        .badge-gelb { background: #3a2e00; color: #d29922; }
        .badge-grau { background: #21262d; color: #8b949e; }
